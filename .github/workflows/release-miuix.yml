name: Release (Miuix)

# 打 tag（v*）或在 Actions 页手动触发；构建签名 APK 并发布到 GitHub Releases。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (default: current ref name)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versionCode 依赖完整 git 历史

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEY_STORE_BASE64 not set, building unsigned APK"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore written: $(stat -c%s "$RUNNER_TEMP/release.jks") bytes"

      - name: Assemble signed release
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            ./gradlew :app:assembleAppRelease --no-daemon \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
              -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew :app:assembleAppRelease --no-daemon
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APK=$(ls app/build/outputs/apk/app/release/*.apk | head -1)
          cp "$APK" "dist/legado-miuix-${TAG}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS) || true
          ls -lh dist

      - name: Verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs dist/*.apk | head -20 || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Legado Miuix ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            Miuix UI 迁移预览版（GPLv3，非官方 Legado 发行版）。

            - 安装包名：`com.legado.app.release`，与官方 `com.legado.app` 并存
            - 源码：https://github.com/pinedrink/legado-miuix
            - 迁移记录：docs/ai/miuix-migration-log.md
            - 附件中的 `SHA256SUMS` 可用于校验下载完整性
          files: dist/*
